name: 科技前沿简报

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30，每2天跑一次
    - cron: '30 0 */2 * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write  # 允许 git push last_sent.json

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Ensure latest last_sent.json
        run: git pull --rebase origin main || true

      - name: Run daily news digest
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RSSHUB_URL: https://rsshub.app
        run: python daily_news.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: digest-${{ github.run_number }}
          path: |
            今日简报_*.pdf
            媒体洞察调研看板_*.csv
            llm_raw.txt
            last_sent.json
          retention-days: 30

      - name: Commit last_sent.json
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sent.json || true
          git diff --cached --quiet || git commit -m "update last_sent.json [skip ci]"
          git push || true
