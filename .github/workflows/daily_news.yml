name: 科技前沿简报

on:
  # schedule 已禁用（GitHub 定时会延迟数小时甚至漏跑）
  workflow_dispatch:  # 支持手动触发
    inputs:
      feishu_webhook_test:
        description: '试跑：粘贴测试群 webhook（该次不发邮件、不更新去重库）。留空=正式跑'
        required: false
        type: string

permissions:
  contents: write  # 允许 git push last_sent.json

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Ensure latest last_sent.json
        run: git pull --rebase origin main || true

      - name: Run daily news digest
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_WEBHOOK_TEST: ${{ github.event.inputs.feishu_webhook_test }}
          TEST_MODE: ${{ github.event.inputs.feishu_webhook_test && '1' || '' }}
          RSSHUB_URL: https://rsshub.bestblogs.dev
        run: |
          # LLM 服务偶发 429/读超时会让整次跑静默失败（当天就收不到简报）。
          # 失败重试一次；脚本内部记录已完成的推送步骤，重跑不会重复发。
          if python daily_news.py; then
            exit 0
          fi
          echo "首次运行失败，等待 120 秒后重试一次…"
          sleep 120
          python daily_news.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: digest-${{ github.run_number }}
          path: |
            今日简报_*.pdf
            媒体洞察调研看板_*.csv
            llm_raw.txt
            last_sent.json
          retention-days: 30

      - name: Commit last_sent.json
        if: success() && !github.event.inputs.feishu_webhook_test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sent.json || true
          git diff --cached --quiet || git commit -m "update last_sent.json [skip ci]"
          git push || true
