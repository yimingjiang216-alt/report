name: 科技前沿简报

on:
  # 不用 GitHub 自带的 schedule：2026-10-09 晚到 6 小时、10-10/10-11 直接没触发。
  # 定时由外部 cron-job.org 每天 08:30 调 workflow_dispatch API（见 外部定时触发配置.md）。
  workflow_dispatch:  # 手动 / 外部定时触发
    inputs:
      feishu_webhook_test:
        description: '试跑：粘贴测试群 webhook（该次不发邮件、不更新去重库）。留空=正式跑'
        required: false
        type: string

permissions:
  contents: write  # 允许 git push last_sent.json

# 同一天的触发串行执行：后触发的排队而不是并发跑。并发时两个 run 读到的
# last_sent.json 都还是昨天的日期，「今天已发过」日闸拦不住；而且两边各自
# push last_sent.json 会互相顶掉（10-10 去重库丢行就是这个 race）。
concurrency:
  group: digest
  cancel-in-progress: false  # 不取消正在跑的正式一期，只排队

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Ensure latest last_sent.json
        run: git pull --rebase origin main || true

      - name: Run daily news digest
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_WEBHOOK_TEST: ${{ github.event.inputs.feishu_webhook_test }}
          TEST_MODE: ${{ github.event.inputs.feishu_webhook_test && '1' || '' }}
          RSSHUB_URL: https://rsshub.bestblogs.dev
        run: |
          # LLM 服务偶发 429/读超时会让整次跑静默失败（当天就收不到简报）。
          # 失败重试一次；脚本内部记录已完成的推送步骤，重跑不会重复发。
          if python daily_news.py; then
            exit 0
          fi
          echo "首次运行失败，等待 120 秒后重试一次…"
          sleep 120
          python daily_news.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: digest-${{ github.run_number }}
          path: |
            今日简报_*.pdf
            媒体洞察调研看板_*.csv
            llm_raw.txt
            last_sent.json
          retention-days: 30

      - name: Commit last_sent.json
        if: success() && !github.event.inputs.feishu_webhook_test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sent.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update last_sent.json [skip ci]"
          # main 可能在本次运行期间被别的 commit 推进（2026-10-10 实测：09:14 的 run
          # 期间被 3 个 commit 插队，push 被拒且 `|| true` 吞掉错误 → 去重库丢了 5 个
          # 标题 → 之后两天 FCC/联想天禧/Anthropic 重发）。推送前先 rebase 再 push，
          # 失败重试 3 次；仍失败就把 job 标红——去重库丢了必须让人看见，不能静默。
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ last_sent.json 已保存，去重库不丢"
              exit 0
            fi
            echo "第 $i 次推送失败，10 秒后重试…"
            sleep 10
          done
          echo "::error::last_sent.json 推送失败——本条去重库没保存，下次运行会重发本期条目。别在 GitHub 界面 Re-run（会重发整期），把这件事告诉我处理。"
          exit 1
